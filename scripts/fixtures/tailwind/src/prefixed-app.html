<!doctype html>
<!--
  The source of an app built with its own prefix (prefixed-input.css, prefix(tw)): the same
  classes as app.html, each with the app's tw: prefix, so only that build generates them. Wave's
  component classes carry Wave's own prefix (wave:) and come precompiled, whatever the app's.
-->
<html lang="en">
  <body>
    <main class="tw:p-4 tw:duration-wave-normal tw:ease-wave-decelerate-mid">Consumer content</main>
    <p
      class="tw:bg-wave-primary tw:text-wave-body-1 tw:border-wave-border tw:shadow-wave-4 tw:font-wave tw:wave-rtl:rotate-180"
    >
      Consumer content in Wave's tokens
    </p>
  </body>
</html>
